# timezone.fyi is moving from Netlify to the Cloudflare Worker in this repo
# (docs/plans/2026-11-25-worker-refactor.md, section 10). The Netlify
# functions are gone, so a build from this commit on would publish a broken
# site. An ignore command that exits 0 tells Netlify to skip the build, and
# the last published deploy keeps serving timezone.fyi until the domain moves
# to the Worker. Delete this file with the Netlify site.
[build]
  ignore = "exit 0"
